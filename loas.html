<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tabla por Voz (Exportable)</title>
    <!-- Carga de Tailwind CSS para un diseño moderno y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuración de la fuente Inter -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl p-6 sm:p-10">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-6 border-b pb-2">
            Gestor de Bibliografía por Dictado de Voz
        </h1>
        
        <!-- Área de Control y Estado de la Voz -->
        <div class="mb-8 p-5 bg-blue-50 border border-blue-200 rounded-xl shadow-inner">
            <p id="prompt-display" class="text-lg font-semibold text-blue-800 mb-4">
                Presiona 'Iniciar Dictado' para comenzar a ingresar un nuevo libro.
            </p>
            
            <!-- Botón de Inicio de Dictado -->
            <button id="start-dictation" 
                    class="w-full sm:w-auto px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition duration-300 shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 disabled:opacity-50 disabled:cursor-not-allowed"
                    onclick="startDictation()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 inline mr-2 align-text-bottom">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5v3m0 0a3 3 0 0 1-3-3v-1.5m3 4.5a3 3 0 0 0 3-3v-1.5M15 9.75a3 3 0 0 1-6 0V5.25a3 3 0 0 1 6 0v4.5Z" />
                </svg>
                Iniciar Dictado
            </button>
            
            <p id="status-message" class="mt-3 text-sm text-gray-600 hidden">...</p>
        </div>

        <!-- Área de la Tabla de Resultados -->
        <div class="mt-10">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">
                Registros de Libros
            </h2>

            <div class="overflow-x-auto rounded-lg shadow-md border border-gray-100">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Autor</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Edición</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lugar</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Editorial</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Año</th>
                        </tr>
                    </thead>
                    <tbody id="books-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Las filas de la tabla se insertarán aquí por JavaScript -->
                        <tr>
                            <td colspan="6" class="px-4 py-4 text-center text-sm text-gray-500 italic">
                                La tabla está vacía. Inicia un dictado para añadir tu primer libro.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botón de Exportación -->
            <div class="mt-6 text-right">
                <button id="export-csv" 
                        class="px-6 py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition duration-300 shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 disabled:opacity-50"
                        onclick="exportCSV()" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 inline mr-2 align-text-bottom">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    Exportar a Excel (CSV)
                </button>
            </div>
        </div>
        
    </div>

    <script>
        // Configuración y variables globales
        const fields = ["Título", "Autor", "Número de Edición", "Lugar de Publicación", "Editorial", "Año de Publicación"];
        let books = [];
        let currentRecord = {};
        let currentFieldIndex = 0;
        let isRecording = false;

        // Referencias a elementos del DOM
        const promptDisplay = document.getElementById('prompt-display');
        const statusMessage = document.getElementById('status-message');
        const startButton = document.getElementById('start-dictation');
        const tableBody = document.getElementById('books-table-body');
        const exportButton = document.getElementById('export-csv');

        // Función de utilidad para actualizar la UI
        const updateUI = () => {
            // Actualizar el estado del botón de exportación
            exportButton.disabled = books.length === 0;
            
            // Actualizar la tabla
            renderTable();
        };

        // 1. Inicialización y Comprobación de API de Voz
        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false; // Detener después de cada dictado
            recognition.interimResults = false; // Solo resultados finales
            recognition.lang = 'es-ES'; // Configurar el idioma a español
            
            // Listener de resultados de voz
            recognition.onresult = (event) => {
                isRecording = false;
                startButton.disabled = false;
                
                const transcript = event.results[0][0].transcript.trim();
                
                // Procesar el texto transcrito
                processTranscript(transcript);
            };

            // Listener de error
            recognition.onerror = (event) => {
                isRecording = false;
                startButton.disabled = false;
                promptDisplay.textContent = "Error de Voz: " + event.error + ". Inténtalo de nuevo.";
                statusMessage.classList.remove('hidden');
                statusMessage.textContent = "Asegúrate de permitir el acceso al micrófono y hablar claro.";
                console.error("Speech Recognition Error:", event.error);
                // Si hay un error, reseteamos el estado para poder empezar de nuevo
                currentFieldIndex = 0;
                currentRecord = {};
            };

            // Listener de finalización
            recognition.onend = () => {
                isRecording = false;
                // Si no se está esperando una nueva entrada, el botón se puede usar
                if (currentFieldIndex === 0) {
                    startButton.disabled = false;
                }
            };
            
        } else {
            // Si el navegador no soporta la API de Voz
            promptDisplay.classList.add('bg-red-100', 'border-red-300', 'text-red-800', 'p-3', 'rounded-lg');
            promptDisplay.textContent = "Tu navegador no soporta la API de Reconocimiento de Voz. Intenta con Chrome o Edge.";
            startButton.disabled = true;
        }

        /**
         * Inicia el proceso de dictado para el campo actual.
         */
        function startDictation() {
            if (!recognition || isRecording) return;

            isRecording = true;
            startButton.disabled = true;
            statusMessage.classList.add('hidden');
            
            // Si es el inicio, resetear el registro
            if (currentFieldIndex === 0) {
                currentRecord = {};
            }
            
            const fieldName = fields[currentFieldIndex];
            promptDisplay.textContent = `🎤 Diga el valor para: "${fieldName}"`;
            
            try {
                recognition.start();
            } catch (e) {
                isRecording = false;
                startButton.disabled = false;
                promptDisplay.textContent = "Error al iniciar el dictado. Ya hay una operación en curso.";
                console.error("Error starting recognition:", e);
            }
        }

        /**
         * Procesa la transcripción de voz y avanza al siguiente campo.
         * @param {string} transcript - El texto reconocido por la API de Voz.
         */
        function processTranscript(transcript) {
            const fieldName = fields[currentFieldIndex];
            
            // Asignar el valor al registro actual
            currentRecord[fieldName] = transcript;
            
            // Mostrar la última entrada
            statusMessage.classList.remove('hidden');
            statusMessage.textContent = `✅ Capturado para ${fieldName}: "${transcript}"`;
            
            // Mover al siguiente campo
            currentFieldIndex++;

            if (currentFieldIndex < fields.length) {
                // Continuar con el siguiente campo
                const nextFieldName = fields[currentFieldIndex];
                promptDisplay.textContent = `Siguiente campo: "${nextFieldName}". Presione Iniciar Dictado nuevamente.`;
                startButton.disabled = false; // Re-habilitar el botón para el siguiente campo
            } else {
                // Se han dictado todos los campos, guardar el registro
                books.push(currentRecord);
                
                // Mostrar mensaje de éxito y limpiar el estado para el siguiente libro
                promptDisplay.textContent = `🥳 Libro COMPLETADO y añadido: "${currentRecord['Título']}". Presione Iniciar Dictado para un nuevo registro.`;
                statusMessage.textContent = "¡Registro guardado con éxito!";
                
                // Resetear el estado
                currentRecord = {};
                currentFieldIndex = 0;
                
                // Actualizar la UI (tabla y botón de exportar)
                updateUI();
            }
        }

        /**
         * Dibuja las filas de datos en la tabla HTML.
         */
        function renderTable() {
            tableBody.innerHTML = ''; // Limpiar el contenido actual

            if (books.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-4 py-4 text-center text-sm text-gray-500 italic">
                            La tabla está vacía. Inicia un dictado para añadir tu primer libro.
                        </td>
                    </tr>
                `;
                return;
            }

            // Crear las filas para cada libro
            books.forEach(book => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition duration-150';

                // Usar el orden de 'fields' para asegurar el orden correcto de las celdas
                fields.forEach(field => {
                    const cell = document.createElement('td');
                    cell.className = 'px-4 py-3 whitespace-nowrap text-sm text-gray-800';
                    // Sanitizar y usar el valor. Si el año es un número, centrarlo.
                    const value = book[field] || '';
                    cell.textContent = value;
                    if (field.includes('Año') || field.includes('Edición')) {
                        cell.classList.add('text-center');
                    }
                    row.appendChild(cell);
                });

                tableBody.appendChild(row);
            });
        }
        
        /**
         * Convierte los datos de la tabla a formato CSV y fuerza la descarga.
         */
        function exportCSV() {
            if (books.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            // Crear la cabecera CSV
            const header = fields.map(h => `"${h.replace(/"/g, '""')}"`).join(';'); // Usar ';' como separador para compatibilidad con Excel en muchos países europeos y latinoamericanos
            
            // Crear las filas de datos CSV
            const rows = books.map(book => 
                fields.map(field => {
                    // Obtener el valor, convertir a string y escapar las comillas
                    let value = (book[field] || '').toString();
                    value = value.replace(/"/g, '""');
                    return `"${value}"`;
                }).join(';')
            );
            
            // Unir la cabecera y las filas
            const csvContent = [header, ...rows].join('\n');

            // Crear un Blob (archivo binario) con el contenido CSV
            // Usamos 'text/csv;charset=utf-8;' para forzar la codificación UTF-8
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); // \uFEFF es el BOM para ayudar a Excel a reconocer UTF-8
            
            // Crear un enlace temporal para forzar la descarga
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'registros_bibliograficos_' + new Date().toISOString().slice(0, 10) + '.csv';
            
            // Simular un clic para iniciar la descarga
            document.body.appendChild(a);
            a.click();
            
            // Limpiar el enlace temporal
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // Mostrar mensaje de éxito (temporalmente en el prompt)
            promptDisplay.textContent = "✅ Exportación completada. Revisa tu carpeta de descargas.";
            setTimeout(() => {
                 // Volver al mensaje inicial
                promptDisplay.textContent = "Presiona 'Iniciar Dictado' para comenzar a ingresar un nuevo libro.";
            }, 3000); 
        }

        // Inicializar la UI al cargar
        document.addEventListener('DOMContentLoaded', updateUI);

    </script>
</body>
</html>
