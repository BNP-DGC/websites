<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listados de MBD para Descarte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-blue-800 text-white shadow-lg">
        <div class="max-w-6xl mx-auto p-4 flex items-center space-x-4">
            <img 
                src="https://munijauja.gob.pe/wp-content/uploads/2024/05/Biblioteca-Nacional-del-Peru.jpg" 
                alt="Logo BNP" 
                class="h-24 p-2 bg-white" 
                onerror="this.onerror=null; this.src='https://placehold.co/120x96/0e7490/ffffff?text=BNP';"
            >
            <h1 class="text-xl sm:text-3xl font-extrabold">
                Listados de MBD para Descarte
            </h1>
        </div>
    </header>

    <main class="flex-grow p-4 sm:p-8">
        <div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-2xl p-6 sm:p-10">
            
            <div class="mb-8 p-5 bg-blue-50 border border-blue-200 rounded-xl shadow-inner">
                <p id="prompt-display" class="text-lg font-semibold text-blue-800 mb-4">
                    Presiona 'Iniciar Dictado' para comenzar a ingresar un nuevo libro.
                </p>
                
                <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
                    
                    <button id="start-dictation" 
                            class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition duration-300 shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            onclick="startDictation()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 inline mr-2 align-text-bottom">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5v3m0 0a3 3 0 0 1-3-3v-1.5m3 4.5a3 3 0 0 0 3-3v-1.5M15 9.75a3 3 0 0 1-6 0V5.25a3 3 0 0 1 6 0v4.5Z" />
                        </svg>
                        Iniciar Dictado
                    </button>

                    <button id="skip-field" 
                            class="w-full sm:w-auto px-6 py-3 bg-yellow-500 text-white font-bold rounded-xl hover:bg-yellow-600 transition duration-300 shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-yellow-400 focus:ring-opacity-50 disabled:opacity-50"
                            onclick="skipField()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 inline mr-2 align-text-bottom">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11.35 15.1H5.7a.35.35 0 0 1-.35-.35V8.85a.35.35 0 0 1 .35-.35h5.65m3.7 7H18.3a.35.35 0 0 0 .35-.35V8.85a.35.35 0 0 0-.35-.35h-3.25m-2.1 4.5h2.1" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="m14 12 2-2m-2 4 2-2m-2 0h-4m-2 0h-4" />
                        </svg>
                        Saltar Campo
                    </button>
                </div>
                
                <p id="status-message" class="mt-3 text-sm text-gray-600 hidden">...</p>
            </div>

            <div class="mt-10">
                <h2 class="text-2xl font-bold text-gray-700 mb-4 border-b pb-2">
                    Registros de Libros
                </h2>

                <div class="overflow-x-auto rounded-lg shadow-md border border-gray-100">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-blue-100">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">Título</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">Autor</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">Edición</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">Lugar</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">Editorial</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">Año</th>
                            </tr>
                        </thead>
                        <tbody id="books-table-body" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-4 py-4 text-center text-sm text-gray-500 italic">
                                    La tabla está vacía. Inicia un dictado para añadir tu primer libro.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-6 text-right">
                    <button id="export-csv" 
                            class="px-6 py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition duration-300 shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-emerald-500 focus:ring-opacity-50 disabled:opacity-50"
                            onclick="exportCSV()" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 inline mr-2 align-text-bottom">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
                        </svg>
                        Exportar a Excel (CSV)
                    </button>
                </div>
            </div>
            
        </div>
    </main>
    
    <footer class="bg-blue-800 text-white mt-8 p-3 shadow-inner">
        <div class="max-w-6xl mx-auto text-center text-sm font-light">
            Elaborado por Nicky Palomino - UGDS - DGC - BNP
        </div>
    </footer>

    <script>
        const fields = ["Título", "Autor", "Número de Edición", "Lugar de Publicación", "Editorial", "Año de Publicación"];
        let books = [];
        let currentRecord = {};
        let currentFieldIndex = 0;
        let isRecording = false;
        
        let recognitionTimeout;
        const MAX_DICTATION_TIME = 15000; 

        const promptDisplay = document.getElementById('prompt-display');
        const statusMessage = document.getElementById('status-message');
        const startButton = document.getElementById('start-dictation');
        const skipButton = document.getElementById('skip-field');
        const tableBody = document.getElementById('books-table-body');
        const exportButton = document.getElementById('export-csv');

        const updateUI = () => {
            exportButton.disabled = books.length === 0;
            skipButton.disabled = currentFieldIndex === 0;
            
            renderTable();
        };

        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'es-ES';
            
            recognition.onresult = (event) => {
                isRecording = false;
                clearTimeout(recognitionTimeout);
                startButton.disabled = false;
                
                const transcript = event.results[0][0].transcript.trim();
                
                processTranscript(transcript);
            };

            recognition.onerror = (event) => {
                isRecording = false;
                clearTimeout(recognitionTimeout);
                startButton.disabled = false;

                let errorMessage = "Error de Voz desconocido. Inténtalo de nuevo.";
                if (event.error === 'no-speech') {
                    handleTimeout();
                    return; 
                } else if (event.error === 'not-allowed') {
                    errorMessage = "Acceso al micrófono denegado. Por favor, permite el acceso en la configuración de tu navegador.";
                } else if (event.error === 'network') {
                    errorMessage = "Error de red. Asegúrate de tener conexión a Internet.";
                } else {
                    errorMessage = `Error: ${event.error}. Vuelve a intentarlo.`;
                }

                promptDisplay.textContent = errorMessage;
                statusMessage.classList.remove('hidden');
                statusMessage.textContent = "El estado del registro se ha reseteado.";
                
                currentFieldIndex = 0;
                currentRecord = {};
                updateUI();
            };

            recognition.onend = () => {
                isRecording = false;
                clearTimeout(recognitionTimeout);
                if (currentFieldIndex < fields.length) {
                    startButton.disabled = false;
                }
            };
            
        } else {
            promptDisplay.classList.add('bg-red-100', 'border-red-300', 'text-red-800', 'p-3', 'rounded-lg');
            promptDisplay.textContent = "Tu navegador no soporta la API de Reconocimiento de Voz. Intenta con Chrome o Edge.";
            startButton.disabled = true;
        }

        function handleTimeout() {
            promptDisplay.textContent = `⌛ Tiempo agotado (15s). Presiona 'Iniciar Dictado' para volver a intentar el campo: "${fields[currentFieldIndex]}"`;
            statusMessage.classList.remove('hidden');
            statusMessage.textContent = "El micrófono se detuvo por inactividad. Repite el dictado del campo actual.";
            startButton.disabled = false;
            updateUI();
        }

        function startDictation() {
            if (!recognition || isRecording) return;

            isRecording = true;
            startButton.disabled = true;
            skipButton.disabled = true;
            statusMessage.classList.add('hidden');
            
            if (currentFieldIndex === 0) {
                currentRecord = {};
            }
            
            const fieldName = fields[currentFieldIndex];
            promptDisplay.textContent = `🎤 Diga el valor para: "${fieldName}" (Máx. 15 segundos)`;
            
            clearTimeout(recognitionTimeout);

            recognitionTimeout = setTimeout(() => {
                if (isRecording) {
                    recognition.stop();
                    handleTimeout();
                }
            }, MAX_DICTATION_TIME);

            try {
                recognition.start();
            } catch (e) {
                isRecording = false;
                startButton.disabled = false;
                clearTimeout(recognitionTimeout);
                promptDisplay.textContent = "Error al iniciar el dictado. Ya hay una operación en curso.";
                console.error("Error starting recognition:", e);
                updateUI();
            }
        }

        function skipField() {
            if (currentFieldIndex === 0) return;

            const fieldName = fields[currentFieldIndex];
            
            currentRecord[fieldName] = "";
            
            statusMessage.classList.remove('hidden');
            statusMessage.textContent = `⏭️ Campo saltado: "${fieldName}"`;
            
            currentFieldIndex++;
            continueProcess();
        }

        function processTranscript(transcript) {
            const fieldName = fields[currentFieldIndex];
            
            currentRecord[fieldName] = transcript;
            
            statusMessage.classList.remove('hidden');
            statusMessage.textContent = `✅ Capturado para ${fieldName}: "${transcript}"`;
            
            currentFieldIndex++;
            continueProcess();
        }

        function continueProcess() {
            if (currentFieldIndex < fields.length) {
                const nextFieldName = fields[currentFieldIndex];
                promptDisplay.textContent = `Siguiente campo: "${nextFieldName}". Presione Iniciar Dictado o Saltar Campo.`;
                startButton.disabled = false;
            } else {
                books.push(currentRecord);
                
                promptDisplay.textContent = `🥳 Libro COMPLETADO y añadido: "${currentRecord['Título'] || 'Registro sin título'}". Presione Iniciar Dictado para un nuevo registro.`;
                statusMessage.textContent = "¡Registro guardado con éxito!";
                
                currentRecord = {};
                currentFieldIndex = 0;
            }
            updateUI();
        }

        function renderTable() {
            tableBody.innerHTML = '';

            if (books.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-4 py-4 text-center text-sm text-gray-500 italic">
                            La tabla está vacía. Inicia un dictado para añadir tu primer libro.
                        </td>
                    </tr>
                `;
                return;
            }

            books.forEach(book => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-blue-50 transition duration-150';

                fields.forEach(field => {
                    const cell = document.createElement('td');
                    cell.className = 'px-4 py-3 whitespace-nowrap text-sm text-gray-800';
                    
                    const value = book[field] || '';
                    cell.textContent = value;
                    if (field.includes('Año') || field.includes('Edición')) {
                        cell.classList.add('text-center');
                    }
                    row.appendChild(cell);
                });

                tableBody.appendChild(row);
            });
        }
        
        function exportCSV() {
            if (books.length === 0) {
                promptDisplay.textContent = "⚠️ No hay datos para exportar.";
                setTimeout(() => {
                    promptDisplay.textContent = "Presiona 'Iniciar Dictado' para comenzar a ingresar un nuevo libro.";
                }, 3000);
                return;
            }

            const header = fields.map(h => `"${h.replace(/"/g, '""')}"`).join(';'); 
            
            const rows = books.map(book => 
                fields.map(field => {
                    let value = (book[field] || '').toString();
                    value = value.replace(/"/g, '""');
                    return `"${value}"`;
                }).join(';')
            );
            
            const csvContent = [header, ...rows].join('\n');

            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); 
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'registros_bibliograficos_' + new Date().toISOString().slice(0, 10) + '.csv';
            
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            promptDisplay.textContent = "✅ Exportación completada. Revisa tu carpeta de descargas.";
            setTimeout(() => {
                promptDisplay.textContent = "Presiona 'Iniciar Dictado' para comenzar a ingresar un nuevo libro.";
            }, 3000); 
        }

        document.addEventListener('DOMContentLoaded', updateUI);

    </script>
</body>
</html>
